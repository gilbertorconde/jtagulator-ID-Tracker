name: Studio CI

on:
  push:
    paths: ["studio/**", ".github/workflows/studio-ci.yml"]
  pull_request:
    paths: ["studio/**", ".github/workflows/studio-ci.yml"]

defaults:
  run:
    working-directory: studio

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: studio/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # OpenOCD checks the generated .cfg files in tests/openocd.test.ts.
      - run: sudo apt-get update && sudo apt-get install -y openocd
      - run: pnpm check
      - run: pnpm test
        env:
          OPENOCD: /usr/bin/openocd
      - run: pnpm build
      # The command-line tool: bundle it and run it against the simulator.
      - run: pnpm build:cli
      - run: node dist-cli/pinhound.mjs --sim -v 3.3 --json scan jtag | tee /dev/stderr | grep -q '"tdo":5'

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri
      - run: cargo check --locked
        working-directory: studio/src-tauri
