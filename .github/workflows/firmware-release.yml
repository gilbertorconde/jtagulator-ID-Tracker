name: Firmware release

# Push a tag like fw-v1.3 to build the firmware with OpenSpin and attach the
# images to a draft GitHub release. PinHound Studio's Firmware page lists
# these releases under "GitHub releases".
on:
  push:
    tags: ["fw-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build OpenSpin
        run: |
          git clone --depth 1 https://github.com/parallaxinc/OpenSpin.git "$RUNNER_TEMP/OpenSpin"
          make -C "$RUNNER_TEMP/OpenSpin" -j"$(nproc)"
          echo "$RUNNER_TEMP/OpenSpin/build" >> "$GITHUB_PATH"

      - name: Build firmware
        id: build
        run: |
          version="${GITHUB_REF_NAME#fw-v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          mkdir -p out
          openspin -q -b -o "out/PinHound-${version}.binary" JTAGulator.spin
          openspin -q -e -o "out/PinHound-${version}.eeprom" JTAGulator.spin
          openspin -q -b -o out/EEPROM_Update.binary eepromupdate/EEPROM_Update.spin
          # The firmware must report the version in the tag.
          grep -aq "PinHound ${version}" "out/PinHound-${version}.binary"
          ls -l out

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          # Studio's updater reads releases/latest, so firmware releases never take that slot.
          make_latest: false
          name: "PinHound firmware ${{ steps.build.outputs.version }}"
          body: |
            PinHound firmware for the JTAGulator. Install it with PinHound Studio
            (Firmware page, also in the browser) or Propeller Tool.

            - `PinHound-*.binary` / `.eeprom`: the firmware.
            - `EEPROM_Update.binary`: writes the manufacturer database (run it
              from RAM; PinHound Studio does this for you).

            See CHANGES.markdown for what changed.
          files: out/*
