[package]
name = "pinhound-studio"
version = "0.2.0"
description = "PinHound Studio: desktop frontend for the JTAGulator"
edition = "2021"

[lib]
name = "pinhound_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
ureq = "2"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
